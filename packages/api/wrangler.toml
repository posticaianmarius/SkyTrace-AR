# One Worker serves the built phone app (static assets) AND the /api routes.
name = "skytrace-ar"
main = "src/worker.ts"
compatibility_date = "2025-11-01"

[assets]
directory = "../app/dist"
run_worker_first = ["/api/*"]

# Refresh CelesTrak TLEs every 3 hours (CelesTrak updates ~every 2 h; be polite).
[triggers]
crons = ["17 */3 * * *"]

# Create with:  npx wrangler kv namespace create TLE_CACHE   then paste the id here.
# [[kv_namespaces]]
# binding = "TLE_CACHE"
# id = "<your-kv-namespace-id>"

# Custom domain on your Cloudflare zone (uncomment and set):
# routes = [{ pattern = "sky.example.com", custom_domain = true }]

# Secrets (never commit):  npx wrangler secret put OPENSKY_CLIENT_ID
#                          npx wrangler secret put OPENSKY_CLIENT_SECRET
